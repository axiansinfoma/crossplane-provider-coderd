        description: SystemPrompt is the Schema for the SystemPrompts API. ~> This
          resource is experimental. Changes are to be expected, and we recommend using
          it with caution in production environments. The deployment-wide chat system
          prompt for Coder Agents (Settings → Instructions in the dashboard). This
          is a deployment-wide singleton. Declare it once; duplicate resources silently
          overwrite each other. Coder sanitizes the stored prompt (strips invisible
          Unicode characters, normalizes line endings, collapses runs of blank lines,
          and trims surrounding whitespace), and this resource compares values the
          same way, so a trailing newline from file(...) does not cause drift after
          apply. On the first plan after an import, a configured value that differs
          from the live one only by sanitization shows a single in-place normalization
          update and then converges; use trimspace(file(...)) to avoid even that.
          The API has no delete operation for this setting. ~> Warning This resource
          requires Coder version 2.37.0 https://github.com/coder/coder/releases/tag/v2.37.0
          or later, and a token with site-wide owner permissions.
