name: Schema Diff Issues

# Compares config/schema.json against config/generated.lst to find coderd
# Terraform provider resources that are not yet exposed as Crossplane managed
# resources, and files one GitHub issue per resource that isn't already tracked
# by an existing open issue.
#
# - pull_request: dry-run only, and only when the automation itself changes, so
#   it does not run on every unrelated pull request.
# - schedule / workflow_dispatch / push (when TERRAFORM_PROVIDER_VERSION changes
#   on main): creates issues for real.

on:
  pull_request:
    paths:
      - 'scripts/schema_diff_issues.py'
      - '.github/workflows/schema-diff-issues.yml'
  push:
    branches:
      - main
    paths:
      - 'Makefile'
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only, do not create issues)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  schema-diff-issues:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The Makefile is assembled from the build submodule.
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      # Regenerate the list from config.GetProvider() so a stale committed file
      # can never make an already implemented resource look missing.
      - name: Refresh config/generated.lst
        run: make generated-lst

      - name: Determine dry-run mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "dry_run=${INPUT_DRY_RUN}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run schema diff issue automation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          args=(--repo "${REPO}" --label enhancement)
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          ./scripts/schema_diff_issues.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
