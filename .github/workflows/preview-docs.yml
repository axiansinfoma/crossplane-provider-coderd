name: Deploy Docs PR Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths:
      - 'docs/**'
      - '.github/workflows/preview-docs.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The Hextra theme is pulled in as a Hugo module, so Hugo needs Go.
      - name: Setup Go
        if: github.event.action != 'closed'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.x'

      - name: Setup Hugo
        if: github.event.action != 'closed'
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Build documentation (pull request preview)
        if: github.event.action != 'closed'
        working-directory: docs
        env:
          GOTOOLCHAIN: local
        run: hugo --minify --baseURL "https://axiansinfoma.github.io/crossplane-provider-coderd/pr-preview/pr-${{ github.event.pull_request.number }}/"

      # On a closed pull request this removes the preview instead of building
      # one, which is why the steps above are skipped rather than the job.
      - name: Deploy the preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: docs/public
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
